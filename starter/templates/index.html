<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
    Dark mode
  </button>
  <h1>Sudoku Game</h1>
  <div class="game-layout">
    <div class="controls controls-left">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game">New Game</button>
      <button id="note-mode" type="button" aria-pressed="false">Note Mode: Off</button>
    </div>
    <div id="sudoku-board"></div>
    <div class="controls controls-right">
      <span id="timer" aria-label="Elapsed time">00:00</span>
      <button id="hint">Hint</button>
      <button id="check-solution">Check Solution</button>
      <span id="message"></span>
    </div>
  </div>
  <section class="scoreboard" aria-labelledby="scoreboard-title">
    <h2 id="scoreboard-title">Top 10</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
  </section>
  <script src="/static/scoreboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
